[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-worker-panns"
version = "0.1.0"
description = "Isolated NVIDIA JetPack 5 PANNs inference worker"
requires-python = ">=3.8,<3.9"
dependencies = ["orpheus-inference==0.1.0", "panns-inference==0.1.1",
                "numpy==1.24.4", "torch==2.1.0a0+41361538.nv23.06"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
