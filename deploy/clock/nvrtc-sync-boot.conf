# Installed by deploy/clock/install-clock-guard.sh as
# /etc/systemd/system/nvrtc-sync-boot.service.d/10-orpheus.conf (Jetson only)
#
# NVIDIA's nvrtc-sync-boot.service (package nvidia-l4t-init) copies the PMIC
# backup RTC (rtc0, nvvrs-pseq-rtc) onto the system clock. Without a coin cell,
# that RTC restarts at 1970 on every power loss. The unit has no ordering, so it
# ran after systemd-timesyncd had restored the last known time and set the
# clock back to 1970 (jetson1's cold boot, 2026-11-21: 2026-11-21 20:03Z at
# 14.3 s, then 1970-01-01 00:00:42Z at 16.2 s).
#
# Run it before timesyncd instead. With a working battery the RTC time stands.
# Without one, timesyncd then moves the clock forward to its saved timestamp,
# and NTP sets it exactly. NVIDIA's script itself is untouched.
[Unit]
DefaultDependencies=no
After=systemd-remount-fs.service
Before=systemd-timesyncd.service time-set.target sysinit.target shutdown.target
Conflicts=shutdown.target
