# Installed by deploy/clock/install-clock-guard.sh as
# /etc/systemd/system/systemd-time-wait-sync.service.d/10-orpheus.conf
#
# The installer enables systemd-time-wait-sync, so time-sync.target means "NTP
# has set the clock", not merely "timesyncd has started". Every Orpheus service
# orders After=time-sync.target, so none starts recording before that.
#
# The wait is bounded so that an offline station still records. 300 s covers a
# home router and modem cold-starting after the same power cut. When it
# expires, this unit fails (visible in `systemctl --failed`), time-sync.target
# is reached anyway, and Orpheus starts on the clock timesyncd restored from
# its last sync, never 1970. NTP corrects the clock when the network returns.
[Service]
TimeoutStartSec=300
