# Orpheus host-log bounds — installed only by `make install-log-bounds`,
# never by a normal install. Delete this file and restart systemd-journald to
# return to your distribution's defaults; nothing in Orpheus depends on it.
#
# Why each setting is here:
#
# Storage=persistent — without it, a host that has no /var/log/journal keeps the
# journal in /run (RAM). That looks harmless until you need it: the journal is
# lost on every reboot, so a crash takes its own evidence with it, and any
# SystemMaxUse you configured never applies because nothing is written to disk.
# Persistence is what makes the size limit below mean anything.
#
# SystemMaxUse — a hard ceiling on the journal's disk footprint. systemd's own
# default is 10% of the filesystem capped at 4 GiB; 1 GiB is plenty to hold
# days of a station's normal volume (~35 MB/day across all agents) while
# leaving a small root filesystem room to breathe.
#
# ForwardToSyslog=no — the duplication that actually fills disks. On Ubuntu the
# journal is mirrored into /var/log/syslog, which logrotate bounds by SCHEDULE,
# not by size: between rotations it grows without limit, and a skipped rotation
# turns hours into days. Turning the mirror off leaves the journal as the single
# bounded copy. IF YOU RELY ON /var/log/syslog (you ship it elsewhere, or your
# tooling reads it), do not use this file — instead add a size bound to your
# own rotation policy:
#     sudo sed -i 's/^\(\s*\)daily$/\1daily\n\1maxsize 100M/' /etc/logrotate.d/rsyslog
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=2G
MaxRetentionSec=2month
ForwardToSyslog=no
