# Orpheus station: an attached keyboard must not reboot the station.
# Ctrl+Alt+Del normally starts ctrl-alt-del.target (= reboot.target); that
# target is masked separately. This also disables the 7-presses-in-2-seconds
# forced reboot that applies even when the target is masked.
# Revert: delete this file and run `sudo systemctl daemon-reexec`.
[Manager]
CtrlAltDelBurstAction=none
