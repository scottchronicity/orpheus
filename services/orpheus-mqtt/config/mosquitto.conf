# Mosquitto MQTT Broker Configuration for Orpheus Wildlife Monitoring System
# 
# This configuration prioritizes security and reliability for local agent communication.
# All connections are restricted to localhost to prevent external access.

# =============================================================================
# Network Configuration
# =============================================================================

# Listen on localhost only (127.0.0.1) for security
# This prevents external network access while allowing local agents to connect
listener 1883 127.0.0.1

# Maximum number of concurrent client connections
# Wildlife monitoring typically has 5-10 agents, so 100 is generous headroom
max_connections 100

# =============================================================================
# Authentication and Security
# =============================================================================

# Allow anonymous connections (no username/password required)
# This is acceptable since we're localhost-only and simplifies agent setup
# For production deployment with external access, enable password authentication
allow_anonymous true

# Uncomment these lines to enable password authentication in the future:
# allow_anonymous false
# password_file /etc/orpheus/mosquitto_passwd

# =============================================================================
# Persistence Configuration
# =============================================================================

# Enable message persistence to survive broker restarts
# Critical for wildlife monitoring to avoid data loss during system maintenance
persistence true

# Directory for persistent database storage
# Note: Parent directory /var/lib/orpheus/ is shared by all Orpheus services
persistence_location /var/lib/orpheus/mqtt/

# Persist messages every 300 seconds (5 minutes) or when shutting down
autosave_interval 300

# Persist message delivery state for QoS 1 and 2 messages
autosave_on_changes false

# =============================================================================
# Logging Configuration
# =============================================================================

# Log to systemd journal for centralized logging
# Use 'journalctl -u orpheus-mqtt.service' to view logs
log_dest stdout

# Log types to include
log_type error
log_type warning
log_type notice
log_type information

# Include timestamps in log messages
log_timestamp true

# Log format with timestamp
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================================================
# Message Handling
# =============================================================================

# Maximum packet size: 10MB
# Wildlife audio/video data can be large, but we'll use chunking for very large files
max_packet_size 10485760

# Maximum QoS level that the broker will accept
# QoS 2 provides exactly-once delivery (highest reliability)
max_qos 2

# Retain messages by default for subscribers that connect later
# Important for status messages and configuration
retain_available true

# Cap queued and in-flight QoS>0 messages to protect memory usage
max_queued_messages 1000
max_inflight_messages 20

# =============================================================================
# Client Connection Settings
# =============================================================================

# Additional throttles (e.g. sys_interval) are available if bottlenecks appear

# =============================================================================
# Security Best Practices
# =============================================================================

# Disable remote access entirely (defense in depth)
# listener above already binds to 127.0.0.1 in Mosquitto 2.x

# =============================================================================
# Notes for Production Deployment
# =============================================================================
#
# Current setup is optimized for:
# - Local development and testing
# - Single-machine deployments (all agents on same host)
# - Simplified setup without authentication overhead
#
# For production deployments with remote agents, consider:
# 1. Enable TLS/SSL encryption (listener on port 8883)
# 2. Enable password authentication (mosquitto_passwd)
# 3. Configure ACLs (Access Control Lists) for topic-level permissions
# 4. Use different listener addresses or firewall rules
# 5. Implement rate limiting for DoS protection
#
# See Mosquitto documentation for advanced configuration:
# https://mosquitto.org/man/mosquitto-conf-5.html
