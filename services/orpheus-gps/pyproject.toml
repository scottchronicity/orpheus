# NOTE: This project uses requirements.txt for dependencies
# GPS runs independently from the Jetson inference environments.
# The pyproject.toml enables proper package discovery for VS Code and other tools.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project]
name = "orpheus-gps"
# Version SSoT: the VERSION file (read at build time). See docs/adr/0014.
dynamic = ["version"]
description = "GPS service for Orpheus spatiotemporal context"
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "gps", "location", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "orpheus-common>=0.2.0",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0,<7.0",
    "pyserial>=3.5,<4.0",
    "pynmea2>=1.18.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_gps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP007",  # Retain the repository's existing typing style in this component
    "UP045",  # Runtime modernization does not require an annotation rewrite
]
