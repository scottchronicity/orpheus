# NOTE: This project uses requirements.txt for dependencies
# for compatibility with older pip versions (Python 3.9.5).
# The pyproject.toml enables proper package discovery for VS Code and other tools.

[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-gps"
version = "0.1.0"
description = "GPS service for Orpheus spatiotemporal context"
readme = "README.md"
requires-python = ">=3.9, <3.10"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "gps", "location", "mqtt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "orpheus-common",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0,<7.0",
    "pyserial>=3.5,<4.0",
    "pynmea2>=1.18.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.10",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_gps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP007",  # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045",  # Use Optional[X] instead of X | None for Python 3.9 compatibility
]
