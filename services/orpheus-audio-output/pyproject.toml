# NOTE: This project uses requirements.txt for dependencies
# for compatibility with older pip versions (Python 3.9.5).
# The pyproject.toml enables proper package discovery for VS Code and other tools.

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project]
name = "orpheus-audio-output"
# Version SSoT: the VERSION file (read at build time). See docs/adr/0014.
dynamic = ["version"]
description = "Keeps Orpheus's audio output (output device + audio server) ready for playback"
readme = "README.md"
requires-python = ">=3.9, <3.10"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "audio", "bluetooth", "pulseaudio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "orpheus-common>=0.2.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest>=7.4",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_audio_output*"]

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP007",  # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045",  # Use Optional[X] instead of X | None for Python 3.9 compatibility
    "UP006",  # typing.Tuple/List are fine for Python 3.9 compatibility
    "UP035",
]
