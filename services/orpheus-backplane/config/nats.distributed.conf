# Orpheus messaging backplane — NATS + JetStream, DISTRIBUTED (LAN listener).
#
# Used ONLY when the backbone serves OTHER hosts (e.g. a NUC backbone with sensor
# agents on the Jetson). The shipped loopback `nats.conf` is never edited; opening
# the listener selects THIS file (see `make install-backbone LISTEN=... AUTH_FILE=...`,
# docs/designs/distributed-deployment.md §D4 / ADR 0018).
#
# SECURITY (the one software guardrail): the client listener is open to the LAN, so
# `make install-backbone` REFUSES to deploy this without an AUTH_FILE. Auth is an
# `include`d NATS `authorization { ... }` block (user/pass + per-role subject
# permissions), owner-supplied as /etc/orpheus/backplane/nats.auth. The monitoring
# endpoint stays LOOPBACK here — never exposed. TLS + any reverse proxy are
# owner-managed (a trusted LAN may defer TLS; an untrusted segment must not).

# LAN client listener. `make install-backbone LISTEN=<addr>` rewrites this line to
# the operator's bind address; 0.0.0.0:4222 is the default open value.
listen: 0.0.0.0:4222
server_name: orpheus-backplane

# Auth is MANDATORY for an open listener. Owner-supplied; installed next to this
# file. include is resolved relative to this config's directory.
include "nats.auth"

# Monitoring stays loopback — readiness/health probes only, never LAN-exposed.
http: 127.0.0.1:8222

jetstream {
    # Same file-backed, bounded JetStream as the loopback config (the Jetson
    # non-negotiable): history on disk, never the GPU's unified RAM.
    store_dir: $ORPHEUS_BACKPLANE_STORE
    max_memory_store: 0
    max_file_store: 2GB
}

max_payload: 8MB
logtime: true
