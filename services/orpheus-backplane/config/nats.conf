# Orpheus messaging backplane — NATS + JetStream.
#
# The default backplane broker (see docs/designs/actor-model-and-control-plane.md).
# One ARM-native binary gives core pub/sub (the "stream of consciousness") plus
# JetStream: durable replayable streams (event-sourcing), a KV store (hot state +
# presence), and request-reply.
#
# JETSON-NON-NEGOTIABLE config (the linchpin of the decision): FILE storage with
# bounded caps, so the broker's footprint stays near mosquitto and never grows
# into the GPU's unified RAM pool. History lives on disk, not memory.

# Localhost only — same posture as the mosquitto config (no inbound exposure).
listen: 127.0.0.1:4222
server_name: orpheus-backplane

# Monitoring endpoint (localhost) for readiness/health probes: /healthz, /varz.
http: 127.0.0.1:8222

jetstream {
    # store_dir comes from the environment so the same config works on the Jetson
    # (systemd sets /var/lib/orpheus/backplane/jetstream) and the Mac dev box
    # (the make target sets $ORPHEUS_DATA_ROOT/backplane/jetstream).
    store_dir: $ORPHEUS_BACKPLANE_STORE
    # 0 = no RAM-resident streams; everything is file-backed (the whole point).
    max_memory_store: 0
    # Hard cap on total on-disk JetStream usage so it can't fill the Jetson.
    max_file_store: 2GB
}

# Detection event payloads are small JSON; clip refs are paths, not blobs.
max_payload: 8MB

# Log to stdout so journald (Linux) / the foreground run (Mac) captures it.
logtime: true
