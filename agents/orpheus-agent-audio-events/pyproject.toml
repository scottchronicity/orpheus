[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project]
name = "orpheus-agent-audio-events"
# Version SSoT: the VERSION file (read at build time). See docs/adr/0014.
dynamic = ["version"]
description = "General-purpose audio event classification agent using PANNs SED on the AudioSet 527-class ontology"
authors = [{name = "Orpheus Project"}]
requires-python = ">=3.9, <3.10"
dependencies = [
    "orpheus-common>=0.2.0",
    "torch==2.4.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0.0",
    "resampy>=0.4.0",
    # PANNs inference (Kong et al., MIT). Provides SoundEventDetection wrapper
    # around Cnn14_DecisionLevelMax checkpoint with framewise outputs.
    "panns-inference>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orpheus_agent_audio_events = ["py.typed", "data/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "TRY", "RUF"]
ignore = ["S101", "TRY003", "PLR0913", "PLR2004", "PT019"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
