[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-agent-video-motion"
version = "0.1.0"
description = "Video motion detection agent for Orpheus wildlife monitoring system"
readme = "README.md"
requires-python = ">=3.9, <3.10"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "video", "motion-detection", "opencv", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "orpheus-common",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.26.0,<3.0",
    "opencv-python>=4.8.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_agent_video_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # function is too complex
    "UP006", # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP035", # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP007", # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045", # Use Optional[X] instead of X | None for Python 3.9 compatibility
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
