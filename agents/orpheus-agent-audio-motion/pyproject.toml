[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-agent-audio-motion"
version = "0.1.0"
description = "Audio motion detection agent for Orpheus cross-species communication system"
readme = "README.md"
requires-python = ">=3.9, <3.10"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "bioacoustics", "audio", "motion-detection", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "orpheus-common",
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0,<7.0",
    "numpy>=1.21,<3.0",
    "soundfile>=0.13.1,<0.14",
    "sounddevice>=0.4.6,<0.6.0",
    "mutagen>=1.47.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.6",
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_agent_audio_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP006",  # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP035",  # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP007",  # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045",  # Use Optional[X] instead of X | None for Python 3.9 compatibility
]
