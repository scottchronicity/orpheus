### PulseAudio configuration to prevent auto-loading the Behringer UMC404HD
### This allows orpheus-agent-audio-motion to have exclusive access
###
### Installation:
### sudo cp pulseaudio-blacklist.conf /etc/pulse/default.pa.d/
### pulseaudio --kill  # Restart PulseAudio
###

# Unload module-udev-detect (which auto-loads USB audio devices)
unload-module module-udev-detect

# Load it again but tell it to ignore the Behringer (card index 0)
# This keeps other audio devices working while excluding the Behringer
load-module module-udev-detect tsched=0 ignore_dB=1

# Alternative: If you want to be more specific, blacklist by USB vendor/product ID
# The Behringer UMC404HD has vendor ID 1397 (BEHRINGER) and product ID 0508
# Uncomment this line instead of the above if you prefer:
# load-module module-udev-detect tsched=0 ignore_dB=1 blacklist="usb-1397:0508"
