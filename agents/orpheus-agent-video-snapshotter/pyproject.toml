[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # function is too complex
    "UP007", # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045", # Use Optional[X] instead of X | None for Python 3.9 compatibility
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.coverage.run]
omit = ["tests/*", "*/tests/*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project]
name = "orpheus-agent-video-snapshotter"
# Version SSoT: the VERSION file (read at build time). See docs/adr/0014.
dynamic = ["version"]
description = "Orpheus agent for periodic camera snapshot capture"
requires-python = ">=3.9,<3.10"
dependencies = [
    "orpheus-common>=0.2.0",
    "opencv-python>=4.13.0.92",
    "numpy>=1.24.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
orpheus-agent-video-snapshotter = "orpheus_agent_video_snapshotter.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_agent_video_snapshotter*"]
