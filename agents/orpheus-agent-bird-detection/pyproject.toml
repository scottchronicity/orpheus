[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[project]
name = "orpheus-agent-bird-detection"
# Version SSoT: the VERSION file (read at build time). See docs/adr/0014.
dynamic = ["version"]
description = "Bird species detection agent using BirdNET ONNX model"
authors = [{name = "Orpheus Project"}]
requires-python = ">=3.9, <3.10"
dependencies = [
    "orpheus-common>=0.2.0",
    "onnxruntime>=1.19.0",
    "huggingface-hub>=0.20.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0.0",
    # main.py imports scipy.signal.resample_poly directly — declare it rather
    # than riding librosa's transitive dependency. <2.0 mirrors the numpy pin.
    "scipy>=1.8,<2.0",
    "tensorflow>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.20",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PL", "TRY", "RUF"]
ignore = ["S101", "TRY003", "TRY300", "PLR0913", "PLR2004", "UP006", "UP035", "UP045", "DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
