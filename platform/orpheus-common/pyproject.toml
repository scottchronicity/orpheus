[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-common"
# Version is the single source of truth in the VERSION file (read at build
# time). Bump it with scripts/bump-version.sh. See docs/adr/0014.
dynamic = ["version"]
description = "Shared platform library for Orpheus cross-species communication system"
readme = "README.md"
requires-python = ">=3.9, <3.10"
license = {text = "MIT"}
authors = [
    {name = "Orpheus Project", email = "scottchronicity@gmail.com"}
]
keywords = ["wildlife", "bioacoustics", "cross-species", "communication", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    # The messaging backplane: NATS+JetStream is the default transport; paho-mqtt
    # stays for the mqtt fallback backend (event_bus.backend: mqtt).
    "nats-py>=2.6,<3",
    "paho-mqtt>=2.1.0",
    "requests>=2.31.0",
    "psutil>=5.9.6",
    "Pillow>=10.0.0",
    "structlog>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff==0.15.20",
    "mypy>=1.7.0"
]
# OpenTelemetry tracing ([REFACTOR] OTel Migration). Optional so the default
# install footprint is unchanged; without it, get_tracer/setup_tracing no-op.
# Pinned <1.42: 1.41.x is the last line supporting Python 3.9 (the repo floor).
telemetry = [
    "opentelemetry-sdk>=1.38,<1.42",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<1.42",
]

[project.urls]
Homepage = "https://github.com/scottchronicity/orpheus"
Documentation = "https://github.com/scottchronicity/orpheus/tree/main/platform/orpheus-common"
Repository = "https://github.com/scottchronicity/orpheus"
Issues = "https://github.com/scottchronicity/orpheus/issues"

[project.scripts]
orpheus-replay = "orpheus_common.replay:main"
orpheus-weather = "orpheus_common.weather:main"
orpheus-mirror = "orpheus_common.mirror:main"
orpheus-public-export = "orpheus_common.portal.export:main"
orpheus-config-push = "orpheus_common.config_push:main"
orpheus-reconcile = "orpheus_common.reconcile:main"
orpheus-manifest-gen = "orpheus_common.manifest_gen:main"
orpheus-storage-sweep = "orpheus_common.storage.sweep:main"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orpheus_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --strict-markers"
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP006",  # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP035",  # Use List/Dict/Tuple/Deque from typing for Jetpack compatibility
    "UP007",  # Use Optional[X] instead of X | Y for Python 3.9 compatibility
    "UP045",  # Use Optional[X] instead of X | None for Python 3.9 compatibility
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
