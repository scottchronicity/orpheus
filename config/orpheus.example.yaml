# Orpheus Observe Stack Configuration
# =========================================
# Canonical configuration for the Orpheus Observe stack.
# Used on Jetson in production; macOS overrides go in config/.env.orpheus.
# Copy to /etc/orpheus/orpheus.yaml (Jetson) or use as-is via ORPHEUS_CONFIG_PATH (dev).
# Override any value with environment variables: ORPHEUS_<SECTION>__<KEY>=value

site:
  name: "Orpheus Station"
  lat: 42.970151
  lon: -85.660179
  elevation: 0.0

# Which broker the messaging backplane uses ([REFACTOR] Event Bus Evolution).
# Default "nats" = NATS + JetStream (installed/run by services/orpheus-backplane).
# Set backend: "mqtt" to fall back to mosquitto. nats_url points at the broker.
# The nats backend is a full drop-in: pub/sub, request-reply, durable streams + KV,
# MQTT retained-message parity (KV last-value), and KV-TTL presence (LWT replacement).
# Only qos has no NATS analogue (at-least-once comes via JetStream consumers).
event_bus:
  backend: "nats"            # nats | mqtt
  nats_url: "nats://127.0.0.1:4222"
  # Whether a cold broker at connect() is fatal. Unset/false (the default):
  # never fatal — the agent comes up "disconnected" and a background retry
  # attaches when the broker appears (self-healing across single-host upgrade
  # restarts). Set true to hard-fail instead, when you want systemd to surface
  # a missing broker loudly. verify-deploy's broker probe catches a genuinely
  # absent broker at deploy time.
  # connect_required: true
  # Emit KV-TTL presence from every agent's heartbeat (nats only; the LWT
  # replacement — a kill -9'd agent ages out within ~3x the heartbeat). Default
  # off: it's new broad behavior. No effect on the mqtt backend (native LWT).
  presence_enabled: false
  # Operational-health migration off the domain bus (observability design §11).
  # health_kv_enabled: producers ALSO write health to the orpheus_health KV plane
  # (additive shadow, nats only). health_on_bus: producers keep publishing health
  # on the bus — leave true until the UI is confirmed reading KV + soaked;
  # flipping it off is the LAST migration step. Both no-op on mqtt.
  health_kv_enabled: false
  health_on_bus: true

# Distributed config over the backplane KV (ADR 0018). When enabled, this host
# reads shared config off the KV (seeded by `orpheus-config push` on the authority
# host) merged OVER local YAML — so hosts don't copy identical YAML. env still wins.
# Bootstrap-local: keep `enabled` + `event_bus.nats_url` in LOCAL yaml (they're read
# before the KV layer and are never distributed). Default off -> local YAML only.
config_service:
  enabled: false
  kv_bucket: "orpheus_config"

# Domain event-sourcing shadow (nats only; default off → byte-identical to today).
# When enabled, agents that own a domain stream ALSO publish detections to a bounded
# durable JetStream stream (in addition to the SQLite save) — the durable log's first
# writer + the reconciliation evidence a future "stream is truth" flip needs. SQLite
# stays the source of truth; the stream is capped well under the account store and
# discards oldest, so it reverts by ageing out. See the determinism contract.
event_sourcing:
  shadow_publish_enabled: false
  stream_name: "orpheus_domain"
  max_age_seconds: 604800      # 7 days
  max_bytes: 500000000         # ~500 MB (well under the 2GB account store)

mqtt:
  broker_host: "localhost"  # Override: ORPHEUS_MQTT__BROKER_HOST
  broker_port: 1883
  username: null  # No auth needed for local mosquitto (allow_anonymous true)
  password: null
  keepalive: 60
  topics:
    audio_chunk: "orpheus/audio/chunk"
    audio_analysis: "orpheus/audio/analysis"
    audio_motion_events: "orpheus/audio/motion/events"
    audio_motion_status: "orpheus/audio/motion/status"
    video_frame: "orpheus/video/frame"
    video_analysis: "orpheus/video/analysis"
    video_motion_events: "orpheus/video/motion/events"
    video_motion_status: "orpheus/video/motion/status"
    detection: "orpheus/detection"
    system_status: "orpheus/system/status"

audio:
  sample_rate: 48000
  chunk_size: 2048
  format: "pcm_s32le"
  buffer_duration_ms: 21  # Audio buffer size in milliseconds (~1024 samples @ 48kHz, matches hardware buffer)
  playback_command: "ffplay"  # Audio playback command (aplay, ffplay, paplay, afplay)
  channels:
    # Jetson Orin NX: Behringer UMC404HD inputs exposed via ALSA. Each logical channel
    # maps to one hardware input via color-coded audio cables.
    #------------------------------
    # BASELINE CONFIGURATION - All channels identical for testing
    # Once we verify all 4 channels work correctly, we can differentiate them
    
    # Orange Cable (Port 1)
    - id: 1
      name: "Orange Cable (Port 1)"
      enabled: true
      device: "alsa://orpheus_umc?channel=1"
      detection:
        algorithm: "adaptive_threshold"
        threshold_db: -54.0
        margin_db: 10.0
        release_threshold_db: -59.0
        holdoff_seconds: 2.0
        min_duration_seconds: 0.3
        max_duration_seconds: 30.0
        prebuffer_seconds: 0.5
        window_seconds: 30.0
        update_interval_seconds: 5.0

    # Yellow Cable (Port 2)
    - id: 2
      name: "Yellow Cable (Port 2)"
      enabled: true
      device: "alsa://orpheus_umc?channel=2"
      detection:
        algorithm: "adaptive_threshold"
        threshold_db: -54.0
        margin_db: 10.0
        release_threshold_db: -59.0
        holdoff_seconds: 2.0
        min_duration_seconds: 0.3
        max_duration_seconds: 30.0
        prebuffer_seconds: 0.5
        window_seconds: 30.0
        update_interval_seconds: 5.0

    # Green Cable (Port 3)
    - id: 3
      name: "Green Cable (Port 3)"
      enabled: true
      device: "alsa://orpheus_umc?channel=3"
      detection:
        algorithm: "adaptive_threshold"
        threshold_db: -54.0
        margin_db: 10.0
        release_threshold_db: -59.0
        holdoff_seconds: 2.0
        min_duration_seconds: 0.3
        max_duration_seconds: 30.0
        prebuffer_seconds: 0.5
        window_seconds: 30.0
        update_interval_seconds: 5.0

    # Blue Cable (Port 4)
    - id: 4
      name: "Blue Cable (Port 4)"
      enabled: true
      device: "alsa://orpheus_umc?channel=4"
      detection:
        algorithm: "adaptive_threshold"
        threshold_db: -54.0
        margin_db: 10.0
        release_threshold_db: -59.0
        holdoff_seconds: 2.0
        min_duration_seconds: 0.3
        max_duration_seconds: 30.0
        prebuffer_seconds: 0.5
        window_seconds: 30.0
        update_interval_seconds: 5.0

  # Audio playback sounds configuration
  sounds:
    auto_discover: true
    # sounds_dir: "/opt/orpheus/sounds"  # Override auto-detection if needed

dashboard:
  host: "0.0.0.0"
  port: 8080
  poll_interval: 5000
  services:
    - "orpheus-backplane"
    - "orpheus-ui"
    - "orpheus-agent-audio-motion"
    - "orpheus-agent-audio-playback"
