storage:
  base_path: "/data/orpheus"
  format:
    audio: "flac"
    video: "mp4"
    detections: "sqlite"
  retention:
    raw_audio_days: 30
    raw_video_days: 30
    detections_days: 365

detection:
  min_confidence: 0.8
  species_of_interest: []
  audio_model: "birdnet"
  video_model: "yolo"

bird_detection:
  model_path: "/data/orpheus/models/birdnet.onnx"
  confidence_threshold: 0.1
  location_lat: 42.970151
  location_lon: -85.660179

correlation:
  input_topics:
    - "orpheus/detection/bird/events"
    - "orpheus/detection/crow/events"

video_snapshotter:
  retention_days: 547  # ~1.5 years; old snapshots are purged automatically

hardware:
  platform: "auto"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
