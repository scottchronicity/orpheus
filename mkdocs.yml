site_name: Orpheus
# This is the meta description: what a search result and every link preview shows,
# before anyone reaches the front page. Keep it the public one-liner from README.md.
site_description: >-
  Orpheus listens to a place and tells you what is there — several machine-learning
  models over live audio and video, reconciled into one entry per real animal. It runs
  on hardware you own, and the recordings stay there.
# Published from the public repository to GitHub Pages, which serves it from a
# subpath. Without site_url the search index and canonical links resolve against
# the domain root and 404.
site_url: https://scottchronicity.github.io/orpheus/docs/
docs_dir: docs
# AGENTS.md / CLAUDE.md / README.md / CODING_AGENT_CONTEXT.md stay at the repo root
# (auto-loaders). They are surfaced in the site via include-markdown stubs under
# docs/ — never moved, never copied.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  # Follows the reader's system preference; the toggle overrides it. Both schemes
  # take their colours from docs/stylesheets/extra.css.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - include-markdown:           # inline root-pinned files in place (no fork, no move)
      # Custom delimiters: design docs contain default-syntax {% include-markdown %}
      # EXAMPLES that must render as text, not execute. Only our stubs use {! … !}.
      opening_tag: "{!"
      closing_tag: "!}"

# Build-time link rewrite for the inlined root files (single-source; sources unchanged).
hooks:
  - docs/_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.tasklist: { custom_checkbox: true }
  - tables
  - toc: { permalink: true }
  - attr_list
  - md_in_html

# Hard-gate nav + in-site links; warn on intentional ../-escaping references to the
# source tree (component READMEs etc.) that are deliberately not in the doc site.
validation:
  nav:
    not_found: warn        # under --strict this fails the build on a bad nav path
    omitted_files: info
  links:
    # Source-tree pointers are now absolute GitHub URLs rather than ../-escapes,
    # so a relative link that does not resolve is a real defect. warn surfaces it
    # in the build log without failing --strict on the remaining stragglers.
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore

# Build tooling + the deprecated root-dup, kept out of the rendered site.
exclude_docs: |
  _hooks.py
  requirements-docs.txt
  /README.md
  # Internal planning. Not a page, so nav rules do not cover it — without this
  # line MkDocs copies it verbatim to the published site.
  backlog.json

# Present in docs/ but intentionally not in the nav.
not_in_nav: |
  AGENTS.md
  README.md
  copilot-workspace-instructions/**

