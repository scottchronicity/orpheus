      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_VIDEO_TIMELAPSER }}
        run: make coverage-video-timelapser COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: agents/orpheus-agent-video-timelapser/coverage.xml
          flags: orpheus-agent-video-timelapser
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-video-timelapser
          path: agents/orpheus-agent-video-timelapser/coverage.xml

  test-orpheus-agent-bird-detection:
