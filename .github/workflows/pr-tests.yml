name: PR Tests

on:
  pull_request:
  push:
    branches:
      - main

# Minimum permissions for security
permissions:
  contents: read
  pull-requests: read  # Required for dorny/paths-filter

env:
  PYTHON_VERSION: '3.9'
  COV_REPORTS: "--cov-report=term-missing --cov-report=xml"
  COVERAGE_THRESHOLD_COMMON: '78'
  COVERAGE_THRESHOLD_UI: '70'
  COVERAGE_THRESHOLD_GPS: '70'
  COVERAGE_THRESHOLD_AUDIO_MOTION: '72'
  COVERAGE_THRESHOLD_AUDIO_PLAYBACK: '70'
  COVERAGE_THRESHOLD_AUDIO_EVENTS: '70'
  COVERAGE_THRESHOLD_VIDEO_MOTION: '70'
  COVERAGE_THRESHOLD_VIDEO_SNAPSHOTTER: '70'
  COVERAGE_THRESHOLD_VIDEO_TIMELAPSER: '70'
  COVERAGE_THRESHOLD_BIRD_DETECTION: '70'
  COVERAGE_THRESHOLD_CROW_DETECTION: '70'
  COVERAGE_THRESHOLD_EVENT_CORRELATOR: '70'

jobs:
  # Static drift guardrails (agent wiring #5, docs-site nav #12, non-negotiable
  # count #11). Stdlib-only + fast, and deliberately NOT gated on changed paths: a
  # pure-docs PR that drops a design doc from the nav must still be caught here.
  # This job is in ci-complete's needs, so a red guardrail actually blocks merge.
  guardrails:
    name: Contributor Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check contributor guardrails
        run: make guardrails
      # Lives here (always-on, dependency-free) rather than a path-filtered job:
      # the drift it guards (COMPONENT_DIRS/INSTALLABLE vs services-install) is
      # defined solely in the root Makefile, whose changes no component filter sees.
      - name: Check per-host install set consistency
        run: make check-installable
      # A syntax-broken compose file/overlay must not merge green. `config -q`
      # renders both files with every profile — cheap, no images pulled.
      - name: Validate docker compose files render
        run: docker compose -f docker-compose.dev.yml -f docker-compose.distributed.yml --profile demo --profile fleet config -q

  # Detect which components have changed to optimize test execution
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      common: ${{ steps.filter.outputs.common }}
      ui: ${{ steps.filter.outputs.ui }}
      gps: ${{ steps.filter.outputs.gps }}
      audio-motion: ${{ steps.filter.outputs.audio-motion }}
      audio-playback: ${{ steps.filter.outputs.audio-playback }}
      audio-events: ${{ steps.filter.outputs.audio-events }}
      video-motion: ${{ steps.filter.outputs.video-motion }}
      video-snapshotter: ${{ steps.filter.outputs.video-snapshotter }}
      video-timelapser: ${{ steps.filter.outputs.video-timelapser }}
      bird-detection: ${{ steps.filter.outputs.bird-detection }}
      crow-detection: ${{ steps.filter.outputs.crow-detection }}
      event-correlator: ${{ steps.filter.outputs.event-correlator }}
      makefile-includes: ${{ steps.filter.outputs.makefile-includes }}
      shell-scripts: ${{ steps.filter.outputs.shell-scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      root-config: ${{ steps.filter.outputs.root-config }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common:
              - 'platform/orpheus-common/**'
            ui:
              - 'services/orpheus_ui/**'
            gps:
              - 'services/orpheus-gps/**'
            audio-motion:
              - 'agents/orpheus-agent-audio-motion/**'
            audio-playback:
              - 'agents/orpheus-agent-audio-playback/**'
            audio-events:
              - 'agents/orpheus-agent-audio-events/**'
            video-motion:
              - 'agents/orpheus-agent-video-motion/**'
            video-snapshotter:
              - 'agents/orpheus-agent-video-snapshotter/**'
            video-timelapser:
              - 'agents/orpheus-agent-video-timelapser/**'
            bird-detection:
              - 'agents/orpheus-agent-bird-detection/**'
            crow-detection:
              - 'agents/orpheus-agent-crow-detection/**'
            event-correlator:
              - 'agents/orpheus-agent-event-correlator/**'
              # The repo-level BDD suites + generated failure matrix run from the
              # correlator's venv inside its CI job, so they gate on its filter.
              - 'tests/bdd/**'
            makefile-includes:
              - 'make/**'
              - 'tests/make/**'
            shell-scripts:
              - 'scripts/**'
              - 'tests/bats/**'
              - 'Makefile'
            workflow:
              - '.github/workflows/**'
            root-config:
              - 'pyproject.toml'
              - 'requirements*.txt'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'AGENTS.md'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'CODE_OF_CONDUCT.md'
              - 'SECURITY.md'
              - 'CODING_AGENT_CONTEXT.md'

  check-dependencies:
    name: Check Dependency Consistency
    runs-on: ubuntu-latest
    needs: changes
    # Run if any component changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.gps == 'true' ||
      needs.changes.outputs.audio-motion == 'true' ||
      needs.changes.outputs.audio-playback == 'true' ||
      needs.changes.outputs.audio-events == 'true' ||
      needs.changes.outputs.video-motion == 'true' ||
      needs.changes.outputs.video-snapshotter == 'true' ||
      needs.changes.outputs.video-timelapser == 'true' ||
      needs.changes.outputs.bird-detection == 'true' ||
      needs.changes.outputs.crow-detection == 'true' ||
      needs.changes.outputs.event-correlator == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check dependency versions
        run: make check-deps
      # (make check-installable moved to the always-on guardrails job — a
      # root-Makefile-only PR never trips this job's path filter.)

  test-orpheus-common:
    name: Test orpheus-common
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make install-common

      - name: Run linting
        run: make lint-common

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_COMMON }}
        run: make coverage-common COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: platform/orpheus-common/coverage.xml
          flags: orpheus-common
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-common
          path: platform/orpheus-common/coverage.xml

  test-orpheus-ui:
    name: Test orpheus_ui
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if ui or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/orpheus_ui/frontend/package-lock.json

      - name: Install all dependencies
        working-directory: services/orpheus_ui
        run: make install

      - name: Run backend linting
        working-directory: services/orpheus_ui
        run: make -C backend lint || echo "::warning::Linting issues found in backend"

      - name: Run backend tests with coverage
        working-directory: services/orpheus_ui
        run: make -C backend coverage

      - name: Run frontend linting
        working-directory: services/orpheus_ui
        run: make -C frontend lint || echo "::warning::Linting issues found in frontend"

      - name: Run frontend unit tests with coverage
        working-directory: services/orpheus_ui
        run: make -C frontend test-coverage

      # Test Node.js installation script logic
      - name: Test install script Node.js logic
        working-directory: services/orpheus_ui/systemd
        run: ./test-install.sh

      - name: Build frontend for e2e tests
        working-directory: services/orpheus_ui
        run: make build-frontend

      - name: Run e2e tests
        working-directory: services/orpheus_ui
        env:
          ORPHEUS_CONFIG_PATH: ${{ github.workspace }}/config/orpheus.test.yaml
        run: make test-e2e

      - name: Upload e2e test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: services/orpheus_ui/e2e/test-results/

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: services/orpheus_ui/backend/coverage.xml
          flags: orpheus-ui-backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-ui-backend
          path: services/orpheus_ui/backend/coverage.xml

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: services/orpheus_ui/frontend/coverage/lcov.info
          flags: orpheus-ui-frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-ui-frontend
          path: services/orpheus_ui/frontend/coverage/lcov.info

  test-orpheus-gps:
    name: Test orpheus-gps
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if gps or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.gps == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make install-gps

      - name: Run linting
        run: make lint-gps

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_GPS }}
        run: make coverage-gps COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: services/orpheus-gps/coverage.xml
          flags: orpheus-gps
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-gps
          path: services/orpheus-gps/coverage.xml

  test-orpheus-agent-audio-motion:
