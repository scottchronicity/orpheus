  test-orpheus-agent-crow-detection:
    name: Test orpheus-agent-crow-detection
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if crow-detection or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.crow-detection == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages (torch/CUDA are large)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: crow-detection-pip-${{ runner.os }}-${{ hashFiles('agents/orpheus-agent-crow-detection/requirements.txt', 'agents/orpheus-agent-crow-detection/pyproject.toml') }}
          restore-keys: |
            crow-detection-pip-${{ runner.os }}-

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1

      - name: Install dependencies
        run: make install-crow-detection

      - name: Run linting
        run: make lint-crow-detection

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_CROW_DETECTION }}
        run: make coverage-crow-detection COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: agents/orpheus-agent-crow-detection/coverage.xml
          flags: orpheus-agent-crow-detection
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-crow-detection
          path: agents/orpheus-agent-crow-detection/coverage.xml

  test-orpheus-agent-event-correlator:
    name: Test orpheus-agent-event-correlator
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if event-correlator or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.event-correlator == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: make install-event-correlator

      - name: Run linting
        run: make lint-event-correlator

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_EVENT_CORRELATOR }}
        run: make coverage-event-correlator COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: agents/orpheus-agent-event-correlator/coverage.xml
          flags: orpheus-agent-event-correlator
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-event-correlator
          path: agents/orpheus-agent-event-correlator/coverage.xml

  test-shared-make:
    name: Test Shared Make
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.makefile-includes == 'true' ||
      needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run shared Makefile tests
        run: bash tests/make/test_shared_make.sh

  # Gate job - this is the only job that should be "required" in branch protection
  # All other jobs can be skipped based on path filters, but this job always runs
  # and checks that no jobs failed (allowing skipped jobs to pass)
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-dependencies
      - test-orpheus-common
      - test-orpheus-dashboard
      - test-orpheus-ui
      - test-orpheus-gps
      - test-orpheus-agent-audio-motion
      - test-orpheus-agent-audio-playback
      - test-orpheus-agent-video-motion
      - test-orpheus-agent-video-snapshotter
      - test-orpheus-agent-video-timelapser
      - test-orpheus-agent-bird-detection
      - test-orpheus-agent-crow-detection
      - test-orpheus-agent-event-correlator
      - test-shared-make
    if: always()
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          # Fail if any job failed (but allow skipped)
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more jobs were cancelled"
            exit 1
          fi
          echo "✅ All jobs passed or were skipped"
