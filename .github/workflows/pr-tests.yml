        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 ffmpeg

      - name: Install dependencies
        run: make install-audio-playback

      - name: Run linting
        run: make lint-audio-playback

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_AUDIO_PLAYBACK }}
        run: make coverage-audio-playback COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: agents/orpheus-agent-audio-playback/coverage.xml
          flags: orpheus-agent-audio-playback
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-audio-playback
          path: agents/orpheus-agent-audio-playback/coverage.xml

  test-orpheus-agent-audio-events:
    name: Test orpheus-agent-audio-events
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if audio-events or common changed, or workflow/root config changed.
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.audio-events == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Don't pull LFS objects in CI — the PANNs checkpoint is
          # 312 MB and unit tests use the DeterministicFakeSED. The
          # integration test in tests/integration/ skips when the
          # checkpoint isn't present.
          lfs: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install dependencies
        run: make install-audio-events

      - name: Run linting
        run: make lint-audio-events

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_AUDIO_EVENTS }}
        run: make coverage-audio-events COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: agents/orpheus-agent-audio-events/coverage.xml
          flags: orpheus-agent-audio-events
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-audio-events
          path: agents/orpheus-agent-audio-events/coverage.xml

  test-orpheus-agent-video-motion:
    name: Test orpheus-agent-video-motion
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if video-motion or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.video-motion == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for video
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: make install-video-motion

      - name: Run linting
        run: make lint-video-motion

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_VIDEO_MOTION }}
        run: make coverage-video-motion COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: agents/orpheus-agent-video-motion/coverage.xml
          flags: orpheus-agent-video-motion
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-video-motion
          path: agents/orpheus-agent-video-motion/coverage.xml

  test-orpheus-agent-video-snapshotter:
    name: Test orpheus-agent-video-snapshotter
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if video-snapshotter or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.video-snapshotter == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies for video
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: make install-video-snapshotter

      - name: Run linting
        run: make lint-video-snapshotter

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_VIDEO_SNAPSHOTTER }}
        run: make coverage-video-snapshotter COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: agents/orpheus-agent-video-snapshotter/coverage.xml
          flags: orpheus-agent-video-snapshotter
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-video-snapshotter
          path: agents/orpheus-agent-video-snapshotter/coverage.xml

  test-orpheus-agent-video-timelapser:
    name: Test orpheus-agent-video-timelapser
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if video-timelapser or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.video-timelapser == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
