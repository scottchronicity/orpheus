      - name: Run linting
        run: make lint-video-timelapser

      - name: Run tests with coverage
        env:
          COVERAGE_THRESHOLD: ${{ env.COVERAGE_THRESHOLD_VIDEO_TIMELAPSER }}
        run: make coverage-video-timelapser COV_REPORTS="${{ env.COV_REPORTS }}"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: agents/orpheus-agent-video-timelapser/coverage.xml
          flags: orpheus-agent-video-timelapser
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN || '' }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-orpheus-agent-video-timelapser
          path: agents/orpheus-agent-video-timelapser/coverage.xml

  test-orpheus-agent-bird-detection:
    name: Test orpheus-agent-bird-detection
    runs-on: ubuntu-latest
    needs: [changes, check-dependencies]
    # Run if bird-detection or common changed, or workflow/root config changed
    if: |
      needs.changes.outputs.common == 'true' ||
      needs.changes.outputs.bird-detection == 'true' ||
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.root-config == 'true'

    steps:
      - name: Checkout code
