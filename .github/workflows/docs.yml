name: Docs Site

# The documentation site builds everywhere and publishes from one place.
#
# Build runs on every pull request and on main, in whichever repository this
# lands in, so a broken site fails review rather than the publish. Deploy is
# fenced to the public repository's main branch: the internal mirror has no
# Pages site (private Pages needs a paid plan), and a fork should never publish
# over the canonical one.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede a PR's in-flight build when it is pushed again; never cancel a
# publish that is already running.
concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The same target used locally, so a green CI build means `make docs-preview`
      # renders what this publishes. --strict fails on a broken nav entry, and
      # docs-pages assembles the published layout: a placeholder at the Pages
      # root, the site itself under docs/.
      - name: Assemble the Pages artifact (--strict build + layout)
        run: make docs-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-pages

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'scottchronicity/orpheus'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
