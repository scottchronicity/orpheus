# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies for orpheus-common
  - package-ecosystem: "pip"
    directory: "/platform/orpheus-common"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(common)"

  # Python dependencies for orpheus-dashboard
  - package-ecosystem: "pip"
    directory: "/services/orpheus-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(dashboard)"

  # Python dependencies for orpheus-gps
  - package-ecosystem: "pip"
    directory: "/services/orpheus-gps"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(gps)"

  # Python dependencies for orpheus-mqtt
  - package-ecosystem: "pip"
    directory: "/services/orpheus-mqtt"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(mqtt)"

  # Python dependencies for orpheus-bluetooth-autoconnect
  - package-ecosystem: "pip"
    directory: "/services/orpheus-bluetooth-autoconnect"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(bluetooth)"

  # Python dependencies for orpheus_ui backend
  - package-ecosystem: "pip"
    directory: "/services/orpheus_ui/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(ui)"

  # Python dependencies for orpheus-agent-audio-motion
  - package-ecosystem: "pip"
    directory: "/agents/orpheus-agent-audio-motion"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(audio-motion)"

  # Python dependencies for orpheus-agent-audio-playback
  - package-ecosystem: "pip"
    directory: "/agents/orpheus-agent-audio-playback"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(audio-playback)"

  # Python dependencies for orpheus-agent-bird-detection
  - package-ecosystem: "pip"
    directory: "/agents/orpheus-agent-bird-detection"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(bird-detection)"
    ignore:
      # torch is pinned for Jetson Orin NX compatibility - do not bump
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torchvision"

  # Python dependencies for orpheus-agent-crow-detection
  - package-ecosystem: "pip"
    directory: "/agents/orpheus-agent-crow-detection"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(crow-detection)"
    ignore:
      # torch is pinned for Jetson Orin NX compatibility - do not bump
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torchvision"
      - dependency-name: "fairseq"

  # Python dependencies for orpheus-agent-event-correlator
  - package-ecosystem: "pip"
